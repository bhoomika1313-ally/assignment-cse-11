<!DOCTYPE html>
<head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Bootstrap UI Components</title>
</head>
<body style="background-color:#fdf6f9;">
    <div class="text-center p-4" style="background-color:#d8c7ff; color:#4b3f72;">
        <h1 class="fw-bold">TechStore</h1>
    </div>
    <nav class="navbar navbar-expand-lg" style="background-color:#ffd6e8;">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle Navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" style="color:#4b3f72;">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="#products" style="color:#4b3f72;">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" style="color:#4b3f72;">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" style="color:#4b3f72;">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4" id="products">
        <div class="row g-4">
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
                    class="card-img-top" style="height:250px; object-fit:cover;">
                    <div class="card-body" style="background-color:#d483d7;">
                        <span class="badge text-bg-success">New</span>
                        <h5 class="card-title mt-2">Smart Phone</h5>
                        <p class="card-text">
                            Latest smartphone with amazing features.
                        </p>
                        <h6>₹25,000</h6>
                        <button class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#modal1">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                    class="card-img-top" style="height:250px; object-fit:cover;">
                    <div class="card-body" style="background-color:#d483d7;">
                        <span class="badge text-bg-danger">Sale</span>
                        <h5 class="card-title mt-2">Headphones</h5>
                        <p class="card-text">
                            Wireless headphones with clear sound quality.
                        </p>
                        <h6>₹4,500</h6>
                        <button class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#modal2">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                    class="card-img-top" style="height:250px; object-fit:cover;">
                    <div class="card-body" style="background-color:#d483d7;">
                        <span class="badge text-bg-success">New</span>
                        <h5 class="card-title mt-2">Smart Watch</h5>
                        <p class="card-text">
                            Stylish smartwatch with health tracking.
                        </p>
                        <h6>₹7,999</h6>
                        <button class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#modal3">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
